[package]
name = "ferrum-app-website"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "The workspace's public website: pages and blog posts written in Markdown, a menu, and the site served on its own host, rendered on the server"
repository = "https://github.com/CBFerrum/ferrum-app-website"
build = "build.rs"

[dependencies]
ferrum-kernel = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-meta = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-domain = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
# Its tests check that its interface is a release the platform takes.
ferrum-apps = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[lints.clippy]
# Deliberate patterns shared with the platform: sqlx row tuples.
type_complexity = "allow"

[profile.dev]
debug = "line-tables-only"
