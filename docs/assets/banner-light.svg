<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Ferrum Website: Pages and a blog in Markdown, rendered on the server and served on your own domain.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2f2f1"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2aa196"/><stop offset="1" stop-color="#0c887d"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#0d9488" fill-opacity="0.12"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.35"/></filter>
    <clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
    <style>
      text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .sheen { animation: sweep 9s ease-in-out infinite; }
      .tile { animation: float 7s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-480px) skewX(-18deg); } 60%, 100% { transform: translateX(1760px) skewX(-18deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @media (prefers-reduced-motion: reduce) { .sheen, .tile { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <circle cx="1150" cy="20" r="230" fill="#0d9488" fill-opacity="0.07"/>
    <circle cx="1240" cy="350" r="150" fill="#0d9488" fill-opacity="0.06"/>
    <rect class="sheen" x="0" y="-60" width="260" height="480" fill="url(#sheen)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="28" fill="none" stroke="#cae7e5"/>
  <g class="tile"><g transform="translate(72 102)" filter="url(#shadow)"><rect width="144" height="144" rx="36" fill="url(#tile)"/><g transform="translate(36 36) scale(3)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></g></g></g>
  <text x="264" y="138" font-size="17" font-weight="700" fill="#0d9488" letter-spacing="2.4">FERRUM APP</text>
  <text x="262" y="198" font-size="58" font-weight="750" fill="#0f172a" letter-spacing="-1">Ferrum Website</text>
  <text x="264" y="244" font-size="23" fill="#475569">Pages and a blog in Markdown, rendered on the server</text>
  <text x="264" y="278" font-size="23" fill="#475569">and served on your own domain.</text>
  <g><rect x="264" y="310" width="78" height="30" rx="15" fill="#ddf0ee"/><text x="303.1" y="330" font-size="14.5" font-weight="600" fill="#0a6f66" text-anchor="middle">v0.1.13</text></g>
  <g><rect x="352.2" y="310" width="130" height="30" rx="15" fill="#ddf0ee"/><text x="417.1" y="330" font-size="14.5" font-weight="600" fill="#0a6f66" text-anchor="middle">Own interface</text></g>
  <g><rect x="492" y="310" width="87" height="30" rx="15" fill="#ddf0ee"/><text x="535.4" y="330" font-size="14.5" font-weight="600" fill="#0a6f66" text-anchor="middle">AGPL-3.0</text></g>
</svg>
