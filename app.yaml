id: website
name: Website
version: 0.3.0
publisher: cbferrum
summary: "The workspace's public website: pages and blog posts in Markdown and blocks, templates, a menu with sub-menus, redirects, the brand, and the site on its own host, rendered on the server"
description: README.md
categories: [marketing]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-website
support: https://github.com/CBFerrum/ferrum-app-website/issues
runtime: native
platform: ">=0.4.0, <0.5"
packages: [website]
uninstall: ask
# Its own interface at /website/: the pages and posts with their previews. The public site is
# served on a `site:website` host (an administrator gives the workspace's domain to it).
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: website
      route: website
      title: Website
      description: Your public site's pages and blog
      icon: layout-grid
      color: "#0d9488"
      roles: [Site Editor]
  shell.open:
    - {id: website, package: website, path: "website/e/{entity}/{id}", list: "website/e/{entity}"}
  shell.create:
    - {id: web_page, label: Web page, path: website/e/WebPage/new, entity: WebPage}
  # What the assistant should know in Website's pages, and what it suggests asking there.
  shell.assistant:
    - id: website
      title: "Website"
      instructions: >-
        A WebPage (Draft, Published) is a page or a blog post written in Markdown with blocks after its text; only
        published ones that are not templates are on the site. A template (is_template) makes draft pages
        (use_template). WebRedirect leads an old address to a new one, one step. WebsiteSettings holds the brand,
        layout and menu links; site views are a report (site_views).
      suggestions:
        - "Which pages are still drafts?"
        - "What did we publish this month?"
